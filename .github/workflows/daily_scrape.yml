name: Daily Job Scraper

# 觸發條件設定
on:
  schedule:
    # 每天 UTC 00:30 執行（對應香港時間 HKT 08:30 AM，換算公式：HKT - 8 小時）
    - cron: '30 0 * * *'
  # 允許在 GitHub 網頁上點擊「Run workflow」隨時手動測試
  workflow_dispatch:

jobs:
  scrape-and-sync:
    # 指定運行環境：GitHub 託管的最新 Ubuntu 虛擬機（內建 2 核心 CPU / 7GB RAM）
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：下載倉庫代碼到虛擬機
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 步驟 2：設定 Python 執行環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 步驟 3：安裝爬蟲與 Google Sheets 相關套件，並安裝 Playwright 瀏覽器核心
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy gspread google-auth pandas

      # 步驟 4 執行 Python 爬蟲腳本，並直接注入 GCP Secret 環境變數
      - name: Run job crawler script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          python job_crawler.py
